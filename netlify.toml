# MUIRO public storefront: static Netlify build; owner API lives in Supabase.
[build]
  command = ""
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# Storefront views are query-driven, not pathname routes. Leave unknown paths
# unmatched so Netlify serves the custom 404.html with a real 404 status.

# Strict MIME type headers for production assets.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
