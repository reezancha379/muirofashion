# MUIRO - Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PASSCODE = "482917"
  VITE_TOTP_SECRET = "MTWALXMFQ52HTGEQ3L3HVLFPZJSFKT3M"

# Single-page app routing routing rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Strict MIME type headers checking
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
