# MUIRO public storefront: static Netlify build; owner API lives in Supabase.
[build]
  command = "npm run build:static"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://apbuobhhaczrruovfkdu.supabase.co"

# Storefront views are query-driven, not pathname routes. Leave unknown paths
# unmatched so Netlify serves the custom 404.html with a real 404 status.

# Proxy /api requests to the Supabase Edge Function
[[redirects]]
  from = "/api/*"
  to = "https://apbuobhhaczrruovfkdu.supabase.co/functions/v1/muiro-api/api/:splat"
  status = 200

# Strict MIME type headers for production assets.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
